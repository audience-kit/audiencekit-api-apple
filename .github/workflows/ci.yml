name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme AudienceKit -destination 'generic/platform=iOS Simulator'
